[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cayu"
version = "0.16.2"
description = "Python runtime for long-running agents: durable sessions that survive restarts, human approval before side effects, spend caps, multi-agent collaboration, and Claude Code or Codex runs recorded as sessions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Cayu Technologies, Inc." }
]
keywords = [
  "agents",
  "ai-agents",
  "llm",
  "durable-execution",
  "long-running",
  "human-in-the-loop",
  "approvals",
  "budgets",
  "spend-limits",
  "multi-agent",
  "workflow",
  "claude-code",
  "codex",
  "coding-agents",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
dependencies = [
  # Keep HTTPX's transitive TLS/process backend above its security-fix floor.
  "anyio>=4.14.2",
  "certifi>=2024.0",
  "cryptography>=42",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "pydantic>=2.12",
  "referencing>=0.35",
  "typing-extensions>=4.14.1",
  "tzdata>=2024.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
claude-agent-sdk = ["claude-agent-sdk>=0.2.168,<0.3"]
codex = ["openai-codex==0.163.0"]
dev = [
  # Runs the `cayu new --with app-database` project's own migration tests; the
  # generated project depends on these, Cayu itself does not.
  "alembic>=1.13,<2",
  # Exercises the bounded Brotli decoder in egress; not a runtime dependency.
  "brotli>=1.2.1,<2",
  "cryptography>=42",
  "fastapi>=0.115,<0.137",
  "httpx2>=2.12,<3",
  "hypothesis>=6,<7",
  # Official SDK fixture verifies the pinned 2026-07-28 stdio wire contract.
  "mcp==2.2.0",
  "opentelemetry-api>=1.45.1",
  "opentelemetry-sdk>=1.45.1",
  "packaging>=24",
  "pillow>=13.0.0",
  "psycopg[binary]>=3.2",
  "psycopg_pool>=3.2",
  "pypdf>=6.21.2",
  "pytest>=8.0",
  "pytest-split>=0.11,<1",
  "pytest-xdist>=3.8,<4",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2,<3",
  "pyjwt[crypto]>=2.15.0,<3",
  "ruff>=0.11",
  "sse-starlette>=2.0",
  "testcontainers[postgres]>=4.0",
  "ty>=0.0.1a8",
  "uvicorn>=0.30",
  "watchfiles>=1.1,<2",
  "websockets>=17.0.1,<17.1",
]
console = [
  "ipython>=9,<10",
]
recording = [
  "pillow>=13.0.0",
  "websockets>=17.0.1,<17.1",
]
browser = [
  "playwright>=1.61",
]
aws = [
  # Botocore's browser-based `aws login` credential provider requires CRT.
  "boto3[crt]>=1.43.44,<2",
]
postgres = [
  "psycopg[binary]>=3.2",
  "psycopg_pool>=3.2",
]
files = [
  "pillow>=13.0.0",
  "pypdf>=6.21.2",
]
e2b = [
  "e2b>=2.45.1,<3",
]
egress = [
  "cryptography>=42",
]
microsandbox = [
  # Prerelease policy: accept only the exact SDK/runtime baseline Cayu verifies.
  # Upstream patch fixes require a Cayu bump and a fresh live-verification pass.
  "microsandbox==0.6.6",
]
otel = [
  "opentelemetry-api>=1.45.1",
  "opentelemetry-sdk>=1.45.1",
]
vertex = [
  "google-auth[requests]>=2,<3",
]
server = [
  "fastapi>=0.115,<0.137",
  # Verifies a sign-in proxy's identity header (ProxyIdentityAuth).
  "pyjwt[crypto]>=2.15.0,<3",
  "uvicorn>=0.30",
  "watchfiles>=1.1,<2",
  "websockets>=17.0.1,<17.1",
  "sse-starlette>=2.0",
]
server-settings = [
  "fastapi>=0.115,<0.137",
  "pydantic-settings>=2.7,<3",
  "pyjwt[crypto]>=2.15.0,<3",
  "sse-starlette>=2.0",
  "uvicorn>=0.30",
  "watchfiles>=1.1,<2",
  "websockets>=17.0.1,<17.1",
]
oidc = [
  # The server extra, which verifies JWTs too; kept so `cayu[oidc]` installs keep working.
  "fastapi>=0.115,<0.137",
  "pyjwt[crypto]>=2.15.0,<3",
  "sse-starlette>=2.0",
  "uvicorn>=0.30",
  "watchfiles>=1.1,<2",
  "websockets>=17.0.1,<17.1",
]
all = [
  "boto3[crt]>=1.43.44,<2",
  "cryptography>=42",
  "e2b>=2.45.1,<3",
  "fastapi>=0.115,<0.137",
  "google-auth[requests]>=2,<3",
  "ipython>=9,<10",
  "microsandbox==0.6.6",
  "opentelemetry-api>=1.45.1",
  "opentelemetry-sdk>=1.45.1",
  "pillow>=13.0.0",
  "psycopg[binary]>=3.2",
  "psycopg_pool>=3.2",
  "pypdf>=6.21.2",
  "pydantic-settings>=2.7,<3",
  "pyjwt[crypto]>=2.15.0,<3",
  "uvicorn>=0.30",
  "watchfiles>=1.1,<2",
  "websockets>=17.0.1,<17.1",
  "sse-starlette>=2.0",
]

[tool.cayu.optional-dependency-policy]
# Classify every extra except the derived `all` aggregate exactly once.
all-runtime-extras = [
  "aws",
  "console",
  "e2b",
  "egress",
  "files",
  "microsandbox",
  "oidc",
  "otel",
  "postgres",
  "recording",
  "server",
  "server-settings",
  "vertex",
]
excluded-from-all = { browser = "Dashboard and browser verification tooling is opt-in.", claude-agent-sdk = "External-agent vendor SDKs and bundled CLI binaries are explicit opt-ins.", codex = "External-agent vendor SDKs and bundled CLI binaries are explicit opt-ins." }
non-runtime-extras = { dev = "Contributor test and development tools are not runtime extras." }

[project.urls]
Homepage = "https://cayu.dev"
Repository = "https://github.com/cayu-dev/cayu"
Documentation = "https://cayu.dev/docs"
Issues = "https://github.com/cayu-dev/cayu/issues"
Changelog = "https://github.com/cayu-dev/cayu/blob/main/docs/release-notes.md"

[dependency-groups]
nightly = [
  "packaging>=24",
  "pexpect>=4.9; sys_platform != 'win32' and sys_platform != 'emscripten'",
]

[project.scripts]
cayu = "cayu.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "host_journey: full bounded collaboration journeys isolated from unrelated CPU-heavy tests",
  "postgres: tests requiring a disposable Postgres database or sharing its schema",
  "process: real subprocess or container boundary coverage",
  "browser_docker: shared real-browser fixture run together in its own CI lane",
  "postgres_recovery: real process-death coverage requiring the Postgres lane",
  "sigkill_recovery: real process-death recovery coverage run in its own lane",
  "stress: deterministic concurrency and fault-injection coverage",
  "qualification: full-scale evidence, capacity, and end-to-end acceptance checks",
  "store_semantics: keep every store variant in PR CI",
]

[tool.ruff]
target-version = "py311"
src = ["src", "tests", "examples"]
line-length = 100

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "I",     # isort
  "UP",    # pyupgrade
  "B",     # flake8-bugbear
  "SIM",   # flake8-simplify
  "TCH",   # flake8-type-checking
  "RUF",   # ruff-specific
]
ignore = [
  "E501",   # line length (handled by formatter)
  "TC001",  # move app import into TYPE_CHECKING (breaks pydantic)
  "TC003",  # move stdlib import into TYPE_CHECKING (breaks pydantic)
  "RUF012", # mutable class attrs (intentional in test fixtures)
  "RUF043", # regex metachar in pytest match= (intentional)
  "B017",   # blind Exception in tests (testing frozen attrs)
]

[tool.ruff.lint.isort]
known-first-party = ["cayu", "maintenance"]

[tool.ty.environment]
python-version = "3.11"
extra-paths = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/cayu"]
artifacts = [
  "src/cayu/data/**",
  "src/cayu/server/dashboard/**",
]

[tool.hatch.build.targets.wheel.force-include]
"examples/aws/lambda_microvm_sidecar" = "cayu/data/lambda_microvm_sidecar"

[tool.hatch.build.targets.sdist]
include = [
  "/examples/aws/lambda_microvm_sidecar",
  "/src/cayu",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/pyproject.toml",
]
