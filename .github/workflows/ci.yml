name: CI

on:
  # A push to main verifies the merged result: PRs need not be current with main
  # before merging. The concurrency group cancels an older main run, so a burst of
  # merges runs CI once on its newest commit.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

# Only same-repository release branches in the private mirror get release gates.
# Forks, ordinary PRs and public PRs retain the normal PR validation scope.
env:
  PRIVATE_RELEASE_PR: ${{ github.event_name == 'pull_request' && github.event.repository.private && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'main' && startsWith(github.head_ref, 'release/') }}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification-scope:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Verification scope
    runs-on: ${{ fromJSON(vars.CI_RUNNER_ANCILLARY || '["ubuntu-latest"]') }}
    timeout-minutes: 2
    outputs:
      release_candidate: ${{ steps.scope.outputs.release_candidate }}
      dashboard: ${{ steps.scope.outputs.dashboard }}
      release_artifacts: ${{ steps.scope.outputs.release_artifacts }}
      sqlite_cancellation: ${{ steps.scope.outputs.sqlite_cancellation }}
    steps:
      - name: Check out the compared history
        if: github.event_name == 'pull_request'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Select retained high-value verification
        id: scope
        env:
          # Only pull requests select gates from a diff.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Every main push verifies all gates, including work whose earlier
          # run was cancelled by this push. This also covers rewritten history.
          echo "release_candidate=$PRIVATE_RELEASE_PR" >> "$GITHUB_OUTPUT"
          if test "$EVENT_NAME" != "pull_request" || test "$PRIVATE_RELEASE_PR" = "true"; then
            {
              echo "dashboard=true"
              echo "release_artifacts=true"
              echo "sqlite_cancellation=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 scripts/select_ci_jobs.py \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  static:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Static checks
    runs-on: ${{ fromJSON(vars.CI_RUNNER_ANCILLARY || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: python3 scripts/run_ci.py --lane static

  python-tests:
    needs: verification-scope
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Python tests
    uses: ./.github/workflows/python-tests.yml
    with:
      # Private release PRs, nightly and tag runs cover every store.
      stores: ${{ needs.verification-scope.outputs.release_candidate == 'true' && 'all' || (github.event_name == 'pull_request' || github.event_name == 'push' && github.ref == 'refs/heads/main') && 'sqlite' || 'all' }}

  sqlite-cancellation:
    name: SQLite cancellation (Python ${{ matrix.python-version }})
    needs: verification-scope
    if: needs.verification-scope.outputs.sqlite_cancellation == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_ANCILLARY || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Exercise cancellation ownership repeatedly
        run: >-
          python3 scripts/run_ci.py --lane sqlite-cancellation
          --python-version "${{ matrix.python-version }}"

  # The archives are on the release contracts' critical path, so they build
  # beside the verification scope instead of after it; the contracts that
  # consume them still wait for the scope.
  package-build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Build release archives
    runs-on: ${{ fromJSON(vars.CI_RUNNER_ANCILLARY || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    outputs:
      prerelease: ${{ steps.release-package.outputs.prerelease }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Release candidates also verify immutable notes against previous tags.
          fetch-depth: ${{ (startsWith(github.ref, 'refs/tags/v') || env.PRIVATE_RELEASE_PR == 'true') && '0' || '1' }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install package prerequisites
        timeout-minutes: 5
        uses: ./.github/actions/install-system-packages
        with:
          packages: ripgrep
          commands: rg
      - name: Build and verify reproducible release archives
        id: release-package
        run: |
          publishing=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            publishing=(--publishing)
          fi
          python3 scripts/run_ci.py --lane package --package-group build "${publishing[@]}"
      - name: Validate private release candidate
        if: env.PRIVATE_RELEASE_PR == 'true'
        run: |
          uv run --no-project --offline --no-python-downloads --python 3.11 \
            python scripts/verify_release_state.py --notes docs/release-notes.md
          uv run python -m maintenance.model_catalog.check
          release_version="$(uv run python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')"
          uv run python scripts/extract_release_notes.py \
            --notes docs/release-notes.md --version "v$release_version" \
            --output "$RUNNER_TEMP/candidate-release-notes.md"
      # Every verification group and publishing consume these same archive bytes.
      - name: Upload release distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist
          retention-days: 3
          path: dist/first/
          if-no-files-found: error

  package:
    name: Release package contracts (${{ matrix.group }})
    needs: [verification-scope, package-build]
    if: needs.verification-scope.outputs.release_artifacts == 'true'
    # Core verifies the ARM64 sidecar on native ARM. The server journey, its eval
    # boundaries and the layout checks are the longest groups, so they take the
    # larger general workers.
    runs-on: ${{ fromJSON(matrix.group == 'core' && (vars.CI_RUNNER_ARM64 || '["ubuntu-24.04-arm"]') || (matrix.group == 'server' || matrix.group == 'evals' || matrix.group == 'eval-authoring' || matrix.group == 'layout') && (vars.CI_RUNNER_GENERAL || '["ubuntu-latest"]') || (vars.CI_RUNNER_PACKAGE || '["ubuntu-latest"]')) }}
    # Browser groups install browser system packages on each fresh runner.
    timeout-minutes: ${{ (matrix.group == 'server' || matrix.group == 'evals' || matrix.group == 'eval-authoring' || matrix.group == 'dashboard') && 30 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        group: [core, layout, server, evals, eval-authoring, campaign, dashboard, authoring, coding, docker, service]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        # Verification consumes the shared archives and current scripts. Only
        # package-build needs repository history for immutable release checks.
        timeout-minutes: 3
        with:
          fetch-depth: 1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      # Later browser setup reads the same apt sources, so this also keeps
      # Playwright's system dependencies off the slow regional mirror.
      - name: Install coding-composition system dependencies
        timeout-minutes: 5
        uses: ./.github/actions/install-system-packages
        with:
          packages: ripgrep
          commands: rg
      # Core verifies the ARM64 sidecar on a native ARM runner.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: ${{ runner.temp }}/release-dist
      - name: Verify the shared release archives
        run: >-
          python3 scripts/run_ci.py --lane package
          --package-group "${{ matrix.group }}"
          --package-artifacts "${{ runner.temp }}/release-dist"

  dashboard:
    name: Dashboard
    needs: verification-scope
    if: needs.verification-scope.outputs.dashboard == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_ANCILLARY || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            src/cayu/cli/templates/b2b_web/package-lock.json
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: python3 scripts/run_ci.py --lane dashboard

  release-qualification:
    name: Release qualification
    needs: verification-scope
    if: startsWith(github.ref, 'refs/tags/v') || needs.verification-scope.outputs.release_candidate == 'true'
    uses: ./.github/workflows/qualification.yml

  # Publishes to PyPI via Trusted Publishing (OIDC). Runs ONLY on v* tag pushes
  # and only after EVERY validation job above has passed on this same commit;
  # the uploaded bytes are the exact dist/first artifact the package jobs
  # validated. The `pypi` environment must be configured with required
  # reviewers BEFORE any v* tag is pushed (GitHub auto-creates referenced
  # environments without protection rules). The required trusted-publisher,
  # environment, immutable-tag, and default-off PYPI_PUBLISH_ENABLED setup is
  # documented in docs/releasing.md.
  #
  # Release ritual:
  #   1. Land the version bump in pyproject.toml on main.
  #   2. git tag vX.Y.Z && git push origin vX.Y.Z
  #   3. Approve the `pypi` environment deployment once this workflow's
  #      validation jobs are green.
  publish:
    name: Publish to PyPI
    if: >-
      !cancelled() &&
      !failure() &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      vars.PYPI_PUBLISH_ENABLED == 'true'
    needs: [static, python-tests, sqlite-cancellation, package-build, package, dashboard, release-qualification]
    runs-on: ${{ fromJSON(vars.CI_RUNNER_GENERAL || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/cayu/
    permissions:
      # Required for PyPI Trusted Publishing; no API token is used.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist/
      - uses: ./.github/actions/verify-release-tag
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    name: Create GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [publish, package-build]
    runs-on: ${{ fromJSON(vars.CI_RUNNER_GENERAL || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist/
      - uses: ./.github/actions/verify-release-tag
      - name: Select curated release notes
        run: |
          python3 scripts/extract_release_notes.py \
            --notes docs/release-notes.md \
            --version "$GITHUB_REF_NAME" \
            --output "$RUNNER_TEMP/release-notes.md"
      - name: Create release with the published artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_IS_PRERELEASE: ${{ needs.package-build.outputs.prerelease }}
        run: |
          release_flags=(--verify-tag)
          if test "$RELEASE_IS_PRERELEASE" = "true"; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${release_flags[@]}"
