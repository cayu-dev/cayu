name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification-scope:
    name: Verification scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Pull requests run expensive specialist lanes only when their contracts can
    # change. Main and release tags deliberately fail open to the complete gate.
    outputs:
      dashboard: ${{ steps.scope.outputs.dashboard }}
      release_artifacts: ${{ steps.scope.outputs.release_artifacts }}
      sqlite_cancellation: ${{ steps.scope.outputs.sqlite_cancellation }}
    steps:
      - name: Check out pull request history
        if: github.event_name == 'pull_request'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Select conditional verification
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if test "$EVENT_NAME" != "pull_request"; then
            {
              echo "dashboard=true"
              echo "release_artifacts=true"
              echo "sqlite_cancellation=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 scripts/select_ci_jobs.py \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv python install 3.11
      - run: uv sync --frozen --extra dev --extra server --extra browser --python 3.11
      - run: uv run ruff check src/ tests/ examples/ scripts/ maintenance/
      - run: uv run ruff format --check src/ tests/ examples/ scripts/ maintenance/
      - run: uv run ty check src/cayu examples maintenance
      - run: uv run python scripts/generate_sidecar_manifest.py --check
      - run: uv run python scripts/build_dashboard_source_bundle.py --check
      - run: uv lock --check

  test_shards:
    name: Test shard ${{ matrix.shard }}/6 (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      CAYU_REQUIRE_POSTGRES: "1"
      CAYU_REQUIRE_DOCKER_RUNNER: "1"
      CAYU_REQUIRE_DOCKER_EGRESS: "1"
      CAYU_REQUIRE_CURRENT_TEST_DURATIONS: "1"
      COVERAGE_FILE: coverage.${{ github.run_attempt }}.general-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv python install 3.14
      - run: uv sync --frozen --extra dev --extra server --python 3.14
      - name: Test duration-balanced shard
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          coverage_args=()
          if test "$EVENT_NAME" != "pull_request"; then
            coverage_args=(--cov=cayu --cov-branch --cov-report=)
          fi
          uv run pytest -q \
            -m "not (stress or process or postgres)" \
            --splits 6 \
            --group "${{ matrix.shard }}" \
            --splitting-algorithm least_duration \
            --durations=20 \
            "${coverage_args[@]}"
      - name: Upload shard coverage data
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ github.run_attempt }}-general-${{ matrix.shard }}
          path: coverage.${{ github.run_attempt }}.general-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 1

  test_specialists:
    name: Test specialist ${{ matrix.lane }} (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: stress-process
            marker: "stress or process"
            splits: 1
            group: 1
          - lane: postgres-conformance-1
            marker: "postgres and not (stress or process)"
            splits: 2
            group: 1
          - lane: postgres-conformance-2
            marker: "postgres and not (stress or process)"
            splits: 2
            group: 2
    env:
      CAYU_REQUIRE_POSTGRES: "1"
      CAYU_REQUIRE_DOCKER_RUNNER: "1"
      CAYU_REQUIRE_DOCKER_EGRESS: "1"
      CAYU_REQUIRE_PLAYWRIGHT_CONTAINMENT: "1"
      CAYU_REQUIRE_CURRENT_TEST_DURATIONS: "1"
      COVERAGE_FILE: coverage.${{ github.run_attempt }}.specialist-${{ matrix.lane }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv python install 3.14
      - run: uv sync --frozen --extra dev --extra server --extra browser --python 3.14
      - name: Install Chromium for process-containment acceptance
        if: matrix.lane == 'stress-process'
        run: uv run playwright install --with-deps chromium
      - name: Test specialist lane
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          coverage_args=()
          if test "$EVENT_NAME" != "pull_request"; then
            coverage_args=(--cov=cayu --cov-branch --cov-report=)
          fi
          uv run pytest -q \
            -m "${{ matrix.marker }}" \
            --splits "${{ matrix.splits }}" \
            --group "${{ matrix.group }}" \
            --splitting-algorithm least_duration \
            --durations=20 \
            "${coverage_args[@]}"
      - name: Upload specialist coverage data
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ github.run_attempt }}-specialist-${{ matrix.lane }}
          path: coverage.${{ github.run_attempt }}.specialist-${{ matrix.lane }}
          if-no-files-found: error
          retention-days: 1

  memory-evidence-performance:
    name: Memory performance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Enforce current-code memory evidence ceilings
        run: uv run python scripts/run_memory_evidence_performance.py --check
      - name: Enforce current-code knowledge relation ceilings
        if: ${{ !cancelled() }}
        run: uv run python scripts/run_knowledge_relation_performance.py --check
      - name: Enforce current-code knowledge maintenance ceilings
        if: ${{ !cancelled() }}
        run: uv run python scripts/run_knowledge_maintenance_performance.py --check
      - name: Enforce current-code maintenance routing ceilings
        if: ${{ !cancelled() }}
        run: uv run python scripts/run_knowledge_maintenance_routing_performance.py --check

  test:
    name: Test (Python 3.14)
    needs: [test_shards, test_specialists, memory-evidence-performance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAYU_REQUIRE_POSTGRES: "1"
      CAYU_REQUIRE_DOCKER_RUNNER: "1"
      CAYU_REQUIRE_DOCKER_EGRESS: "1"
      COVERAGE_FILE: coverage
    steps:
      - name: Require every test lane
        env:
          PERFORMANCE_RESULT: ${{ needs.memory-evidence-performance.result }}
          SHARD_RESULT: ${{ needs.test_shards.result }}
          SPECIALIST_RESULT: ${{ needs.test_specialists.result }}
        run: |
          test "$PERFORMANCE_RESULT" = "success"
          test "$SHARD_RESULT" = "success"
          test "$SPECIALIST_RESULT" = "success"
      - if: github.event_name != 'pull_request'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - if: github.event_name != 'pull_request'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - if: github.event_name != 'pull_request'
        run: uv python install 3.14
      - if: github.event_name != 'pull_request'
        run: uv sync --frozen --extra dev --extra server --python 3.14
      - name: Download test coverage data
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-${{ github.run_attempt }}-*
          path: coverage-data
          merge-multiple: true
      - name: Report combined coverage
        if: github.event_name != 'pull_request'
        run: |
          uv run coverage combine coverage-data
          uv run coverage report --show-missing --skip-covered
          uv run coverage report \
            --format=markdown \
            --show-missing \
            --skip-covered >> "$GITHUB_STEP_SUMMARY"

  sqlite-cancellation:
    name: SQLite cancellation (Python ${{ matrix.python-version }})
    needs: verification-scope
    if: needs.verification-scope.outputs.sqlite_cancellation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --frozen --extra dev --extra server --python ${{ matrix.python-version }}
      - name: Exercise cancellation ownership repeatedly
        run: |
          for attempt in 1 2 3; do
            uv run pytest -q \
              tests/core/test_sqlite_session_store.py::test_sqlite_off_thread_writer_retains_connection_ownership_during_cancellation \
              tests/core/test_sqlite_session_store.py::test_sqlite_pending_cancellation_retains_off_thread_connection_ownership \
              tests/core/test_sqlite_session_store.py::test_sqlite_task_sweep_cannot_end_off_thread_connection_ownership \
              tests/core/test_sqlite_session_store.py::test_sqlite_off_thread_reader_retains_connection_ownership_during_cancellation \
              tests/core/test_sqlite_session_store.py::test_sqlite_off_thread_worker_failure_and_cancellation_remain_observable \
              tests/core/test_sqlite_session_store.py::test_sqlite_in_memory_read_cancellation_serializes_shared_writer_connection \
              tests/core/test_runtime.py::test_cancelled_sqlite_factory_checkpoint_preserves_committed_allocation \
              tests/core/test_workspace_mutation_receipts.py::test_final_workspace_observer_restores_caller_cancellation_requests \
              tests/core/test_workspace_mutation_receipts.py::test_delegated_stream_close_counts_checkpoint_cancellation_once \
              tests/core/test_workspace_mutation_receipts.py::test_delegated_stream_close_distinguishes_restored_and_late_cancellation
          done

  package:
    name: Release package contracts
    needs: verification-scope
    if: needs.verification-scope.outputs.release_artifacts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      prerelease: ${{ steps.release-version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: uv python install 3.11
      - name: Install coding-composition system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Verify immutable release state
        run: >-
          uv run --no-project --offline --no-python-downloads --python 3.11
          python scripts/verify_release_state.py
          --notes docs/release-notes.md
      # PR and main CI must be deterministic. Freshness is wall-clock policy enforced by
      # scheduled maintenance and release-tag validation; this check validates the committed
      # artifact without making an unchanged branch fail as time passes.
      - run: uv run python -m maintenance.model_catalog.check --skip-staleness
      - name: Enforce freshness for release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        run: uv run python -m maintenance.model_catalog.check
      - name: Check tag matches project version
        id: release-version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          uv run --group nightly python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          from packaging.version import Version

          with Path("pyproject.toml").open("rb") as pyproject:
              version = tomllib.load(pyproject)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(
                  f"tag {tag} does not match pyproject.toml version {version}"
              )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              print(
                  f"prerelease={str(Version(version).is_prerelease).lower()}",
                  file=output,
              )
          PY
      - run: uv build --out-dir dist/first
      - run: uv build --out-dir dist/second
      - name: Check reproducible archives
        run: |
          cmp dist/first/*.tar.gz dist/second/*.tar.gz
          cmp dist/first/*.whl dist/second/*.whl
      - run: uv run python scripts/check_release_artifacts.py dist/first/*
      - run: uv venv --python 3.11 .release-venv
      - run: uv pip install --python .release-venv/bin/python dist/first/*.whl
      - name: Check every packaged guide from the built wheel
        run: |
          .release-venv/bin/python - <<'PY'
          import subprocess
          from cayu.cli.guide import _GUIDES

          for topic in _GUIDES:
              subprocess.run([".release-venv/bin/cayu", "guide", topic], check=True)
          PY
      - run: uv venv --python 3.11 .release-all-venv
      - name: Install and import the built wheel with all runtime extras
        run: |
          wheel="$(realpath dist/first/*.whl)"
          uv pip install --python .release-all-venv/bin/python "cayu[all] @ file://${wheel}"
          .release-all-venv/bin/python - <<'PY'
          import awscrt.auth
          import boto3
          import microsandbox
          from cayu.runners.microsandbox import MicrosandboxRunner

          assert boto3 is not None
          assert awscrt.auth is not None
          assert microsandbox is not None
          assert MicrosandboxRunner is not None
          PY
      - name: Check built-wheel Cayu Cloud CLI contract
        run: |
          .release-venv/bin/cayu cloud --help >/dev/null
          if output="$(.release-venv/bin/cayu cloud env set --secret 2>&1)"; then
            echo "invalid Cayu Cloud command unexpectedly succeeded"
            exit 1
          fi
          CAYU_CLOUD_ERROR_JSON="$output" .release-venv/bin/python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["CAYU_CLOUD_ERROR_JSON"])
          assert payload == {
              "error": {
                  "category": "invalid_input",
                  "message": (
                      "the following arguments are required: assignment, --application"
                  ),
              },
              "ok": False,
          }
          PY
      - run: uv venv --python 3.11 .release-server-venv
      - name: Install built wheel with server extra
        run: |
          for wheel_path in dist/first/*.whl; do
            uv pip install --python .release-server-venv/bin/python "${wheel_path}[server,browser]"
          done
      - run: .release-server-venv/bin/playwright install --with-deps chromium
      - name: Smoke-test protected cayu serve from the built wheel
        run: .release-server-venv/bin/python scripts/smoke_built_wheel_serve.py
      - name: Verify the installed-wheel dashboard-to-local eval journey
        run: |
          unset PYTHONPATH CAYU_PROVIDER OPENAI_API_KEY ANTHROPIC_API_KEY GEMINI_API_KEY
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
          .release-server-venv/bin/python examples/dashboard_behavior_live.py
      - name: Verify editable dashboard source from installed release artifacts
        run: |
          uv venv --python 3.11 .release-sdist-venv
          uv pip install --python .release-sdist-venv/bin/python dist/first/*.tar.gz
          proof_root="$(mktemp -d)"
          .release-venv/bin/cayu dashboard eject "$proof_root/wheel-dashboard"
          .release-sdist-venv/bin/cayu dashboard eject "$proof_root/sdist-dashboard"
          diff -ru "$proof_root/wheel-dashboard" "$proof_root/sdist-dashboard"
          cd "$proof_root/wheel-dashboard"
          node -e 'const scripts = require("./package.json").scripts; if (scripts["build:package"]) process.exit(1)'
          npm ci
          npm run lint
          npm run test
          npm run typecheck
          ln -s "$GITHUB_WORKSPACE/.release-server-venv" "$proof_root/python venv with spaces"
          CAYU_PYTHON="$proof_root/python venv with spaces/bin/python" npm run check:api
          npm run build
          "$GITHUB_WORKSPACE/.release-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/check_ejected_dashboard_build.py" dist
          "$GITHUB_WORKSPACE/.release-server-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/smoke_ejected_dashboard.py" dist
      - name: Check bundled model catalog and price book from the installed wheel
        run: |
          .release-venv/bin/python - <<'PY'
          import cayu

          catalog = cayu.default_model_catalog()
          price_book = cayu.default_price_book()
          assert cayu.__name__ == "cayu"
          assert catalog.models
          assert price_book.prices
          for model in catalog.models:
              assert catalog.match(
                  provider_name=model.provider_name,
                  model=model.model,
              ) == model
              for prefix in model.match_prefixes:
                  assert catalog.resolve(
                      provider_name=model.provider_name,
                      model=f"{prefix}fixture",
                  ) == model
          PY
      # The AWS Lambda MicroVM base image is published for ARM64 only. Register
      # emulation so the amd64 GitHub runner can verify the exact exported image.
      - if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - name: Verify installed wheel and source-distribution sidecar exports
        if: github.event_name != 'pull_request'
        run: bash scripts/verify_release_sidecar_artifacts.sh
      - name: Check built-wheel authoring contract
        run: |
          uv pip install --python .release-venv/bin/python pytest
          .release-venv/bin/python -m cayu version
          project_root="$(mktemp -d)"
          .release-venv/bin/cayu new proof --dir "$project_root"
          cd "$project_root/proof"
          "$GITHUB_WORKSPACE/.release-venv/bin/python" run.py --help >/dev/null
          "$GITHUB_WORKSPACE/.release-venv/bin/cayu" guide anatomy >/dev/null
          "$GITHUB_WORKSPACE/.release-venv/bin/cayu" guide authoring >/dev/null
          "$GITHUB_WORKSPACE/.release-venv/bin/cayu" guide tool-effects >/dev/null
          "$GITHUB_WORKSPACE/.release-venv/bin/python" -c 'from cayu.testing import verify_tool_effect'
          "$GITHUB_WORKSPACE/.release-venv/bin/cayu" inspect --json >/dev/null
          "$GITHUB_WORKSPACE/.release-venv/bin/cayu" check --json >/dev/null
          "$GITHUB_WORKSPACE/.release-venv/bin/python" - <<'PY'
          import run
          from app import build_app
          from cayu import ModelStreamEvent, ScriptedModelProvider

          provider = ScriptedModelProvider([
              ModelStreamEvent.text_delta("ready"),
              ModelStreamEvent.completed({"finish_reason": "stop"}),
          ])
          run.build_app = lambda **_kwargs: build_app(provider=provider)
          assert run.main(["--message", "Run the agent."]) == 0
          PY
          "$GITHUB_WORKSPACE/.release-venv/bin/cayu" generate slice reviewer --tool assess_submission --effect none
          "$GITHUB_WORKSPACE/.release-venv/bin/python" - <<'PY'
          import run
          from app import build_app
          from cayu import ModelStreamEvent, ScriptedModelProvider

          provider = ScriptedModelProvider([
              ModelStreamEvent.text_delta("reviewed"),
              ModelStreamEvent.completed({"finish_reason": "stop"}),
          ])
          run.build_app = lambda **_kwargs: build_app(provider=provider)
          assert run.main([
              "--agent", "reviewer", "--message", "Review the change."
          ]) == 0
          assert len(provider.requests) == 1
          PY
          "$GITHUB_WORKSPACE/.release-venv/bin/cayu" generate slice reviewer --tool assess_submission --effect none --json > repeated-plan.json
          "$GITHUB_WORKSPACE/.release-venv/bin/python" - <<'PY'
          import json
          from pathlib import Path

          from cayu.runtime import APP_MANIFEST_SCHEMA_VERSION

          repeated = json.loads(Path("repeated-plan.json").read_text())
          assert repeated["schema_version"] == APP_MANIFEST_SCHEMA_VERSION
          assert repeated["status"] == "already_present"
          assert repeated["edits"] == []

          agent = Path("agents/reviewer.py")
          source = agent.read_text()
          source = source.replace(
              "when it directly answers the user's request",
              "to assess the submitted proposal against the domain rubric",
          )
          agent.write_text(source)
          PY
          "$GITHUB_WORKSPACE/.release-venv/bin/cayu" inspect --agent reviewer --json > unfinished-inspect.json
          "$GITHUB_WORKSPACE/.release-venv/bin/cayu" check --json > unfinished-check.json
          "$GITHUB_WORKSPACE/.release-venv/bin/python" - <<'PY'
          import json
          from pathlib import Path

          from cayu.runtime import APP_MANIFEST_SCHEMA_VERSION

          inspect = json.loads(Path("unfinished-inspect.json").read_text())
          assert inspect["schema_version"] == APP_MANIFEST_SCHEMA_VERSION
          assert inspect["agents"][0]["authoring_state"] == (
              "unfinished_generated_tracer_bullet"
          )
          check = json.loads(Path("unfinished-check.json").read_text())
          assert [item["code"] for item in check["diagnostics"]] == [
              "AGENT_GENERATED_TRACER_BULLET_UNFINISHED"
          ]
          PY
          if "$GITHUB_WORKSPACE/.release-venv/bin/cayu" check --fail-on warning --json > warning-gate.json; then
            echo "unfinished generated slice unexpectedly passed the warning gate"
            exit 1
          fi
          "$GITHUB_WORKSPACE/.release-venv/bin/python" -m pytest -q
          "$GITHUB_WORKSPACE/.release-venv/bin/cayu" eval run >/dev/null
          "$GITHUB_WORKSPACE/.release-venv/bin/cayu" eval run evals.reviewer:build_eval >/dev/null
          "$GITHUB_WORKSPACE/.release-venv/bin/python" - <<'PY'
          from pathlib import Path

          path = Path("agents/reviewer.py")
          source = path.read_text()
          marker = (
              "    authoring_state="
              "AgentAuthoringState.UNFINISHED_GENERATED_TRACER_BULLET,\n"
          )
          assert marker in source
          source = source.replace("AgentAuthoringState, ", "").replace(marker, "")
          source += "\n# Completed source may still mention sample, echo, or tracer bullet.\n"
          path.write_text(source)
          PY
          "$GITHUB_WORKSPACE/.release-venv/bin/cayu" check --fail-on warning --json > completed-check.json
          "$GITHUB_WORKSPACE/.release-venv/bin/python" - <<'PY'
          import json
          from pathlib import Path

          check = json.loads(Path("completed-check.json").read_text())
          assert check["diagnostics"] == []
          PY
          coding_root="$(mktemp -d)"
          "$GITHUB_WORKSPACE/.release-venv/bin/cayu" new proof-coding \
            --composition coding --dir "$coding_root"
          cd "$coding_root/proof-coding"
          unset CAYU_PROVIDER CAYU_MODEL OPENAI_API_KEY ANTHROPIC_API_KEY \
            OPENROUTER_API_KEY
          test -z "$(git status --porcelain)"
          test "$(git log -1 --format=%s)" = 'Initial Cayu coding composition'
          "$GITHUB_WORKSPACE/.release-venv/bin/cayu" inspect --json > coding-inspect.json
          "$GITHUB_WORKSPACE/.release-venv/bin/cayu" check --json > coding-check.json
          "$GITHUB_WORKSPACE/.release-venv/bin/python" - <<'PY'
          import json
          from pathlib import Path

          inspect = json.loads(Path("coding-inspect.json").read_text())
          assert {agent["name"] for agent in inspect["agents"]} == {
              "proof-coding",
              "proof-coding-reviewer",
          }
          primary = next(
              agent for agent in inspect["agents"] if agent["name"] == "proof-coding"
          )
          assert {tool["name"] for tool in primary["tools"]} >= {
              "search_text",
              "git_changes",
              "remember_knowledge",
              "subagent",
              "subagent_result",
              "ask_user",
          }
          assert inspect["defaults"]["environment"] == "coding"
          assert inspect["stores"]["knowledge"] == "SQLiteKnowledgeStore"
          check = json.loads(Path("coding-check.json").read_text())
          assert check["diagnostics"] == []
          PY
          "$GITHUB_WORKSPACE/.release-venv/bin/python" \
            -m pytest -q tests/test_coding_composition.py
          openrouter_root="$(mktemp -d)"
          "$GITHUB_WORKSPACE/.release-venv/bin/cayu" new proof-openrouter \
            --provider openrouter --dir "$openrouter_root"
          cd "$openrouter_root/proof-openrouter"
          unset CAYU_PROVIDER CAYU_MODEL OPENROUTER_API_KEY \
            OPENROUTER_HTTP_REFERER OPENROUTER_APP_TITLE \
            OPENROUTER_ROUTER_METADATA
          "$GITHUB_WORKSPACE/.release-venv/bin/python" -m pytest -q
          "$GITHUB_WORKSPACE/.release-venv/bin/cayu" eval run >/dev/null
      - name: Check built-wheel secure public-service contract
        run: |
          uv pip install --python .release-server-venv/bin/python pytest 'ruff>=0.15.15,<0.16'
          service_root="$(mktemp -d)"
          .release-server-venv/bin/cayu new proof-service \
            --template service --dir "$service_root"
          cd "$service_root/proof-service"
          unset PYTHONPATH
          export PRODUCT_AUTH_TOKENS_JSON='{"customer-token":{"tenant_id":"tenant-a","subject_id":"alice"}}'
          export CAYU_OPERATOR_BEARER_TOKEN='operator-token'
          "$GITHUB_WORKSPACE/.release-server-venv/bin/cayu" \
            check --deploy --fail-on warning --json > deployment-check.json
          "$GITHUB_WORKSPACE/.release-server-venv/bin/python" - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("deployment-check.json").read_text())
          assert report["diagnostics"] == []
          assert report["service_evidence"] == {
              "application_security": "generated_suite_required",
              "configuration": "supported",
              "control_plane_access": "verified_authenticated",
              "host_owned_behavior": "unverified_outside_contract",
              "security_verification_command": (
                  "pytest -q tests/test_public_service_security.py"
              ),
              "service_contract": "verified_maintained",
          }
          PY
          "$GITHUB_WORKSPACE/.release-server-venv/bin/python" \
            -m pytest -q tests/test_public_service_security.py
          "$GITHUB_WORKSPACE/.release-server-venv/bin/ruff" check .
          "$GITHUB_WORKSPACE/.release-server-venv/bin/ruff" format --check .
      - run: .release-venv/bin/cayu console --help
      - name: Check optional console dependency guidance
        run: |
          if output="$(.release-venv/bin/cayu console cayu.runtime.app:CayuApp 2>&1)"; then
            echo "console unexpectedly started without the console extra"
            exit 1
          fi
          test "$output" = 'error: Cayu console requires IPython. Install it with: pip install "cayu[console]"'
      - name: Check installed CLI version
        run: |
          expected_version="$(.release-venv/bin/python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$(.release-venv/bin/cayu version)" = "cayu ${expected_version}"
      # Publishing consumes these exact bytes: the artifact uploaded here is the
      # dist/first build that every check above validated. The publish job must
      # never rebuild.
      - name: Upload release distribution
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist
          path: dist/first/
          if-no-files-found: error

  release-sidecar-artifacts:
    name: Release sidecar artifacts
    needs: verification-scope
    if: >-
      github.event_name == 'pull_request' &&
      needs.verification-scope.outputs.release_artifacts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv python install 3.11
      - run: uv build --out-dir dist/first
      - run: uv venv --python 3.11 .release-venv
      - run: uv pip install --python .release-venv/bin/python dist/first/*.whl
      - run: uv venv --python 3.11 .release-sdist-venv
      - run: uv pip install --python .release-sdist-venv/bin/python dist/first/*.tar.gz
      # The AWS Lambda MicroVM base image is published for ARM64 only. Register
      # emulation so the amd64 GitHub runner can verify the exported image.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - name: Verify installed wheel and source-distribution sidecar exports
        run: bash scripts/verify_release_sidecar_artifacts.sh

  release-artifacts:
    name: Release artifacts
    needs:
      - verification-scope
      - package
      - release-sidecar-artifacts
    if: >-
      always() &&
      needs.verification-scope.outputs.release_artifacts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every release-artifact lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCOPE_RESULT: ${{ needs.verification-scope.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          SIDECAR_RESULT: ${{ needs.release-sidecar-artifacts.result }}
        run: |
          test "$SCOPE_RESULT" = "success"
          test "$PACKAGE_RESULT" = "success"
          if test "$EVENT_NAME" = "pull_request"; then
            test "$SIDECAR_RESULT" = "success"
          else
            test "$SIDECAR_RESULT" = "skipped"
          fi

  windows-dashboard-artifact:
    name: Windows dashboard artifact
    needs: verification-scope
    if: needs.verification-scope.outputs.release_artifacts == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: uv python install 3.11
      - name: Exercise the native Windows ACL transition
        shell: pwsh
        run: |
          uv sync --frozen --extra dev --python 3.11
          $windowsTests = @(
            "protects_staging_dacl_before_writing",
            "restores_parent_acl_inheritance_after_publication",
            "preserves_published_tree_if_permissions_cannot_be_restored",
            "removes_staging_after_filesystem_failure",
            "refuses_windows_cleanup_junction_replacement",
            "preserves_cleanup_with_preexisting_windows_writer",
            "blocks_windows_writer_after_cleanup_is_pinned"
          ) -join " or "
          uv run pytest -q tests/cli/test_dashboard.py -k $windowsTests
          uv run pytest -q tests/cli/test_lambda_microvm.py
      - run: uv build --wheel --out-dir dist/windows
      - name: Install and eject the built wheel
        shell: pwsh
        run: |
          uv venv --python 3.11 .windows-release-venv
          $wheel = Get-ChildItem dist/windows/*.whl | Select-Object -First 1
          uv pip install --python .windows-release-venv/Scripts/python.exe "$($wheel.FullName)[server]"
          $proofRoot = Join-Path $env:RUNNER_TEMP "cayu dashboard artifact"
          $parent = Join-Path $proofRoot "inherited parent"
          New-Item -ItemType Directory -Force $parent | Out-Null
          $everyone = [System.Security.Principal.SecurityIdentifier]::new("S-1-1-0")
          $readRule = [System.Security.AccessControl.FileSystemAccessRule]::new(
            $everyone,
            [System.Security.AccessControl.FileSystemRights]::ReadAndExecute,
            [System.Security.AccessControl.InheritanceFlags]"ContainerInherit, ObjectInherit",
            [System.Security.AccessControl.PropagationFlags]::None,
            [System.Security.AccessControl.AccessControlType]::Allow
          )
          $parentAcl = Get-Acl $parent
          $parentAcl.AddAccessRule($readRule)
          Set-Acl -Path $parent -AclObject $parentAcl
          $destination = Join-Path $parent "editable dashboard"
          & ./.windows-release-venv/Scripts/cayu.exe dashboard eject $destination
          "DASHBOARD_DESTINATION=$destination" | Out-File $env:GITHUB_ENV -Append
      - name: Verify inherited final access and the extracted API workflow
        shell: pwsh
        run: |
          function Assert-InheritedEveryoneRead([string]$path) {
            $acl = Get-Acl $path
            if ($acl.AreAccessRulesProtected) {
              throw "published path retained a protected DACL: $path"
            }
            $matchingRule = $acl.Access | Where-Object {
              $sid = $_.IdentityReference.Translate(
                [System.Security.Principal.SecurityIdentifier]
              )
              $sid.Value -eq "S-1-1-0" -and
                $_.IsInherited -and
                (($_.FileSystemRights -band
                  [System.Security.AccessControl.FileSystemRights]::ReadAndExecute) -eq
                  [System.Security.AccessControl.FileSystemRights]::ReadAndExecute)
            }
            if (-not $matchingRule) {
              throw "published path did not inherit the parent's read access: $path"
            }
          }
          Assert-InheritedEveryoneRead $env:DASHBOARD_DESTINATION
          Assert-InheritedEveryoneRead (Join-Path $env:DASHBOARD_DESTINATION "package.json")
          Push-Location $env:DASHBOARD_DESTINATION
          try {
            npm ci
            $env:CAYU_PYTHON = Resolve-Path (
              Join-Path $env:GITHUB_WORKSPACE ".windows-release-venv/Scripts/python.exe"
            )
            npm run check:api
          } finally {
            Pop-Location
          }

  dashboard:
    name: Dashboard
    needs: verification-scope
    if: needs.verification-scope.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run typecheck
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv python install 3.11
        working-directory: .
      - run: uv sync --frozen --extra dev --extra server --python 3.11
        working-directory: .
      - run: npm run check:api:repo
      - run: npm run build:package
      - name: Check packaged dashboard assets
        run: |
          status="$(git -C .. status --porcelain -- src/cayu/server/dashboard)"
          if test -n "$status"; then
            echo "$status"
            git -C .. diff --stat -- src/cayu/server/dashboard
            exit 1
          fi

  # Publishes to PyPI via Trusted Publishing (OIDC). Runs ONLY on v* tag pushes
  # and only after EVERY validation job above has passed on this same commit;
  # the uploaded bytes are the exact dist/first artifact the package job
  # validated. The `pypi` environment must be configured with required
  # reviewers BEFORE any v* tag is pushed (GitHub auto-creates referenced
  # environments without protection rules). The required trusted-publisher,
  # environment, immutable-tag, and default-off PYPI_PUBLISH_ENABLED setup is
  # documented in docs/releasing.md.
  #
  # Release ritual:
  #   1. Land the version bump in pyproject.toml on main.
  #   2. git tag vX.Y.Z && git push origin vX.Y.Z
  #   3. Approve the `pypi` environment deployment once this workflow's
  #      validation jobs are green.
  publish:
    name: Publish to PyPI
    # The sidecar artifact lane is intentionally skipped outside pull requests.
    # Explicit status checks prevent that skipped transitive dependency from
    # activating GitHub's implicit success() guard and suppressing publication.
    if: >-
      !cancelled() &&
      !failure() &&
      startsWith(github.ref, 'refs/tags/v') &&
      vars.PYPI_PUBLISH_ENABLED == 'true'
    needs: [static, test, sqlite-cancellation, release-artifacts, windows-dashboard-artifact, dashboard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/cayu/
    permissions:
      # Required for PyPI Trusted Publishing; no API token is used.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist/
      - uses: ./.github/actions/verify-release-tag
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist/
      - uses: ./.github/actions/verify-release-tag
      - name: Select curated release notes
        run: |
          python3 scripts/extract_release_notes.py \
            --notes docs/release-notes.md \
            --version "$GITHUB_REF_NAME" \
            --output "$RUNNER_TEMP/release-notes.md"
      - name: Create release with the published artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_IS_PRERELEASE: ${{ needs.package.outputs.prerelease }}
        run: |
          release_flags=(--verify-tag)
          if test "$RELEASE_IS_PRERELEASE" = "true"; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${release_flags[@]}"
