name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification-scope:
    name: Verification scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      dashboard: ${{ steps.scope.outputs.dashboard }}
      release_artifacts: ${{ steps.scope.outputs.release_artifacts }}
      sqlite_cancellation: ${{ steps.scope.outputs.sqlite_cancellation }}
    steps:
      - name: Check out pull request history
        if: github.event_name == 'pull_request'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Select retained high-value verification
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if test "$EVENT_NAME" != "pull_request"; then
            {
              echo "dashboard=true"
              echo "release_artifacts=true"
              echo "sqlite_cancellation=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 scripts/select_ci_jobs.py \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: python3 scripts/run_ci.py --lane static

  test_shards:
    name: Test shard ${{ matrix.shard }}/6 (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      CAYU_REQUIRE_POSTGRES: "1"
      CAYU_REQUIRE_DOCKER_RUNNER: "1"
      CAYU_REQUIRE_DOCKER_EGRESS: "1"
      CAYU_REQUIRE_CURRENT_TEST_DURATIONS: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Test duration-balanced shard
        run: python3 scripts/run_ci.py --lane general --shard "${{ matrix.shard }}"

  test_specialists:
    name: Test specialist ${{ matrix.lane }} (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [stress-process, postgres-conformance-1, postgres-conformance-2]
    env:
      CAYU_REQUIRE_POSTGRES: "1"
      CAYU_REQUIRE_DOCKER_RUNNER: "1"
      CAYU_REQUIRE_DOCKER_EGRESS: "1"
      CAYU_REQUIRE_PLAYWRIGHT_CONTAINMENT: "1"
      CAYU_REQUIRE_CURRENT_TEST_DURATIONS: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Test specialist lane
        run: >-
          python3 scripts/run_ci.py --lane specialist
          --specialist-lane "${{ matrix.lane }}"

  sqlite-cancellation:
    name: SQLite cancellation (Python ${{ matrix.python-version }})
    needs: verification-scope
    if: needs.verification-scope.outputs.sqlite_cancellation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Exercise cancellation ownership repeatedly
        run: >-
          python3 scripts/run_ci.py --lane sqlite-cancellation
          --python-version "${{ matrix.python-version }}"

  package:
    name: Release package contracts
    needs: verification-scope
    if: needs.verification-scope.outputs.release_artifacts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      prerelease: ${{ steps.release-package.outputs.prerelease }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install coding-composition system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      # The AWS Lambda MicroVM base image is published for ARM64 only. Register
      # emulation before the canonical lane verifies the exact exported image.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - name: Run canonical release package contracts
        id: release-package
        run: |
          publishing=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            publishing=(--publishing)
          fi
          python3 scripts/run_ci.py --lane package "${publishing[@]}"
      # Publishing consumes these exact bytes: the artifact uploaded here is the
      # dist/first build that every check above validated. The publish job must
      # never rebuild.
      - name: Upload release distribution
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist
          path: dist/first/
          if-no-files-found: error

  dashboard:
    name: Dashboard
    needs: verification-scope
    if: needs.verification-scope.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: python3 scripts/run_ci.py --lane dashboard

  # Publishes to PyPI via Trusted Publishing (OIDC). Runs ONLY on v* tag pushes
  # and only after EVERY validation job above has passed on this same commit;
  # the uploaded bytes are the exact dist/first artifact the package job
  # validated. The `pypi` environment must be configured with required
  # reviewers BEFORE any v* tag is pushed (GitHub auto-creates referenced
  # environments without protection rules). The required trusted-publisher,
  # environment, immutable-tag, and default-off PYPI_PUBLISH_ENABLED setup is
  # documented in docs/releasing.md.
  #
  # Release ritual:
  #   1. Land the version bump in pyproject.toml on main.
  #   2. git tag vX.Y.Z && git push origin vX.Y.Z
  #   3. Approve the `pypi` environment deployment once this workflow's
  #      validation jobs are green.
  publish:
    name: Publish to PyPI
    if: >-
      !cancelled() &&
      !failure() &&
      startsWith(github.ref, 'refs/tags/v') &&
      vars.PYPI_PUBLISH_ENABLED == 'true'
    needs: [static, test_shards, test_specialists, sqlite-cancellation, package, dashboard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/cayu/
    permissions:
      # Required for PyPI Trusted Publishing; no API token is used.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist/
      - uses: ./.github/actions/verify-release-tag
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist/
      - uses: ./.github/actions/verify-release-tag
      - name: Select curated release notes
        run: |
          python3 scripts/extract_release_notes.py \
            --notes docs/release-notes.md \
            --version "$GITHUB_REF_NAME" \
            --output "$RUNNER_TEMP/release-notes.md"
      - name: Create release with the published artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_IS_PRERELEASE: ${{ needs.package.outputs.prerelease }}
        run: |
          release_flags=(--verify-tag)
          if test "$RELEASE_IS_PRERELEASE" = "true"; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${release_flags[@]}"
