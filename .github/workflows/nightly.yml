name: Nightly full-store tests

# Pull requests run SQLite store variants only. This runs the same jobs with
# every store (memory, SQLite and Postgres) on main each night.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python-tests:
    name: Python tests
    uses: ./.github/workflows/python-tests.yml
    with:
      stores: all

  # Builds a freshly scaffolded `cayu new --preset coding --execution docker`
  # Dockerfile.coding with a wheel of this commit and runs the generated-project
  # live test. The image build needs snapshot.debian.org and PyPI, so it runs
  # nightly instead of on every pull request.
  generated-docker-coding:
    name: Generated Docker coding image (amd64)
    runs-on: ${{ fromJSON(vars.CI_RUNNER_PACKAGE || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install coding-composition system dependencies
        timeout-minutes: 5
        uses: ./.github/actions/install-system-packages
        with:
          packages: ripgrep
          commands: rg
      - name: Build the candidate wheel
        run: uv build --wheel --out-dir "$RUNNER_TEMP/dist"
      - name: Install test dependencies
        run: uv sync --extra dev
      - name: Build and check a freshly scaffolded Dockerfile.coding
        run: |
          mkdir -p "$RUNNER_TEMP/nightly"
          CAYU_DOCKER_GENERATED_CODING_WHEEL="$(realpath "$RUNNER_TEMP"/dist/*.whl)" \
            uv run python scripts/nightly_verification.py \
              --check docker-live-generated-coding-image --strict \
              --json "$RUNNER_TEMP/nightly/generated-docker-coding.json" \
              --markdown "$RUNNER_TEMP/nightly/generated-docker-coding.md"
      - name: Share the verification report
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-generated-docker-coding
          path: ${{ runner.temp }}/nightly
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
