name: CI execution profiling

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact 40-character commit SHA to profile
        required: true
        type: string
      repetitions:
        description: Independent runs per worker count
        type: choice
        default: "2"
        options: ["1", "2"]

permissions:
  contents: read

jobs:
  collection:
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","linux","x64","gcp-ci","gcp-ci-ancillary"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    outputs:
      repetitions: ${{ steps.inputs.outputs.repetitions }}
    steps:
      - name: Validate comparison inputs
        id: inputs
        shell: bash
        env:
          REVISION: ${{ inputs.revision }}
          REPETITIONS: ${{ inputs.repetitions }}
        run: |
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          case "$REPETITIONS" in
            1) repetitions='[1]' ;;
            2) repetitions='[1,2]' ;;
            *) exit 2 ;;
          esac
          printf 'repetitions=%s\n' "$repetitions" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: python3 scripts/run_ci.py --lane collection --test-manifest "$RUNNER_TEMP/profile-manifest.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: profile-manifest
          path: ${{ runner.temp }}/profile-manifest.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  benchmark:
    needs: collection
    name: Profile ${{ matrix.lane }} / ${{ matrix.workers }} workers / repeat ${{ matrix.repetition }}
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","linux","x64","gcp-ci","gcp-ci-general"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        lane: ["general-1", "postgres-conformance-1"]
        workers: [2, 4, 8]
        repetition: ${{ fromJSON(needs.collection.outputs.repetitions) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: ./.github/actions/install-system-packages
        timeout-minutes: 5
        with:
          packages: ripgrep ffmpeg
          commands: rg ffmpeg
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: profile-manifest
          path: ${{ runner.temp }}
      - name: Profile one worker count on the assigned tests
        shell: bash
        timeout-minutes: 45
        env:
          LANE: ${{ matrix.lane }}
          WORKERS: ${{ matrix.workers }}
        run: |
          if [[ "$LANE" == general-1 ]]; then
            selection=(--lane general --shard 1)
          else
            selection=(--lane specialist --specialist-lane "$LANE")
          fi
          output="$RUNNER_TEMP/ci-profiles"
          mkdir -p "$output"
          python3 scripts/run_ci.py "${selection[@]}" \
            --test-manifest "$RUNNER_TEMP/profile-manifest.json" \
            --test-workers "$WORKERS" --profile-tests "$output" \
            2>&1 | tee "$output/run.log"
      - name: Retain measurements, including failed comparisons
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: execution-profile-${{ matrix.lane }}-${{ matrix.workers }}-workers-repeat-${{ matrix.repetition }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-profiles
          if-no-files-found: error
          retention-days: 7
